<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACM 知识技能树</title>
<link rel="stylesheet" href="css/tree.css">
</head>
<body>
<header>
  <h1>ACM 知识技能树<small>区域赛金牌导向 · 5 大板块</small></h1>
  <div class="grp"><button id="pickBtn" class="pri" title="不知道练什么？智能抽取几个知识点">🎲 练什么？</button></div>
  <div class="grp"><label>目标层级</label><select id="tierSel"><option value="1">铜牌层</option><option value="2">银牌层</option><option value="3">金牌层</option><option value="4" selected>全部（含了解）</option></select></div>
  <div class="grp"><label>板块</label><select id="blockSel"><option value="all">全部</option></select></div>
  <div class="grp"><label>个人方向</label><select id="dirSel" title="与练什么共用个人方向，随账号同步"><option value="all">综合（全部）</option><option value="g">图论 / DS 手</option><option value="m">数学手</option><option value="d">DP / 字符串手</option></select></div>
  <div class="grp"><input id="search" placeholder="搜索知识点 / 识别信号" style="width:190px"></div>
  <div class="grp"><button id="expandAll" class="ghost">全部展开</button><button id="collapseAll" class="ghost">折叠到板块</button><button id="fit" class="ghost">居中</button><button id="themeBtn" class="ghost" title="切换夜间/日间模式">夜间</button></div>
  <span style="flex:1"></span>
  <div class="grp"><button id="exportBtn" class="ghost">导出 JSON</button><button id="importBtn" class="ghost">导入 JSON</button><input type="file" id="importFile" accept=".json" hidden><button id="resetBtn" class="ghost danger">重置</button></div>
</header>
<main>
  <aside id="left"></aside>
  <section id="tree">
    <svg id="svg"><g id="vp"></g></svg>
    <div id="legend"></div>
    <div id="help">拖拽平移 · 滚轮缩放 · 点击节点查看 · 点右侧圆点展开/折叠</div>
  </section>
  <aside id="right"></aside>
</main>
<div class="toast" id="toast"></div>

<script src="js/tree.js"></script>
</body>
</html>
